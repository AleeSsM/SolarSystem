<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4c2"/>
      <stop offset="35%" stop-color="#ffcc33"/>
      <stop offset="70%" stop-color="#ff9900" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunCore" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff8dc"/>
      <stop offset="55%" stop-color="#ffcc33"/>
      <stop offset="100%" stop-color="#e68a00"/>
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b9cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffb050" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Orbitas -->
  <ellipse cx="32" cy="32" rx="29" ry="11" stroke="url(#orbitGrad)" stroke-width="0.9" transform="rotate(-18 32 32)"/>
  <ellipse cx="32" cy="32" rx="23" ry="8.5" stroke="#8b9cff" stroke-opacity="0.28" stroke-width="0.7" transform="rotate(22 32 32)"/>
  <ellipse cx="32" cy="32" rx="17" ry="6" stroke="#ffb050" stroke-opacity="0.22" stroke-width="0.55" transform="rotate(-8 32 32)"/>

  <!-- Resplandor del Sol -->
  <circle cx="32" cy="32" r="15" fill="url(#sunGlow)"/>

  <!-- Sol -->
  <circle cx="32" cy="32" r="9" fill="url(#sunCore)"/>
  <circle cx="29" cy="29" r="2.2" fill="#fff8dc" fill-opacity="0.45"/>

  <!-- Planetas -->
  <circle cx="54" cy="27" r="2.2" fill="#5b8fd9"/>
  <circle cx="53" cy="27" r="2.2" fill="#7eb0ff" fill-opacity="0.35"/>
  <circle cx="12" cy="37" r="1.7" fill="#d4653a"/>
  <circle cx="46" cy="44" r="3.2" fill="#c9924a"/>
  <circle cx="47" cy="43" r="3.2" fill="#e8b86a" fill-opacity="0.25"/>
  <circle cx="17" cy="21" r="1.4" fill="#b0b8c8"/>
  <circle cx="38" cy="14" r="1.9" fill="#e8c87a"/>
  <circle cx="22" cy="48" r="2.5" fill="#6ec4e8"/>
</svg>
